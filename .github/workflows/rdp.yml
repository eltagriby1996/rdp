name: Windows RDP Extreme (Chrome+7Zip+IDM)

on: 
  push:
  workflow_dispatch: # عشان تقدر تشغله يدوياً من GitHub Actions

jobs:
  rdp-setup:
    runs-on: windows-latest
    timeout-minutes: 360  # أقصى مدة مجانية هي 6 ساعات

    steps:
    - name: Install Essentials (Chrome, 7-Zip, IDM)
      run: |
        # تسطب البرامج اللي هتحتاجها عشان تبدأ فوراً
        choco install googlechrome -y
        choco install 7zip -y
        # تسطيب IDM نسخة صامتة (اختياري)
        Invoke-WebRequest "https://files3.internetdownloadmanager.com/idman642build25.exe" -OutFile "idm.exe"
        Start-Process -FilePath "idm.exe" -ArgumentList "/S" -Wait

    - name: Download and extract Ngrok
      run: |
        Invoke-WebRequest "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-stable-windows-amd64.zip" -OutFile ngrok.zip
        Expand-Archive ngrok.zip -DestinationPath "."
        Copy-Item "ngrok.exe" "C:\Windows\System32\ngrok.exe"

    - name: Authenticate Ngrok
      run: |
        ngrok authtoken "${{ secrets.NGROK_AUTH_TOKEN }}"

    - name: Enable RDP and Optimization
      run: |
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        # تسريع الـ RDP عن طريق تقليل الجرافيك
        $SetDisplay = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects"
        if (!(Test-Path $SetDisplay)) { New-Item $SetDisplay -Force }
        Set-ItemProperty -Path $SetDisplay -Name "VisualFXSetting" -Value 2

    - name: Create Admin User
      run: |
        net user monged123 Ahmed@123 /add
        net localgroup administrators monged123 /add

    - name: Start Ngrok Tunnel (Region EU)
      run: |
        # استخدام سيرفرات أوروبا eu بيقلل الـ Lag جداً في مصر
        Start-Process -FilePath "ngrok.exe" -ArgumentList "tcp --region eu 3389"
        Start-Sleep -Seconds 15
        
        $response = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels"
        $tunnelUrl = $response.tunnels[0].public_url -replace "tcp://", ""

        Write-Output "============================================"
        Write-Output "✅ RDP READY! CONNECT NOW"
        Write-Output "Address: $tunnelUrl"
        Write-Output "Username: monged123"
        Write-Output "Password: Ahmed@123"
        Write-Output "============================================"

    - name: Keep Alive (6 Hours Countdown)
      run: |
        $totalMinutes = 360
        while ($totalMinutes -gt 0) {
            Write-Output "Server is running... Remaining: $totalMinutes minutes"
            Start-Sleep -Seconds 60
            $totalMinutes -= 1
        }

    - name: Cleanup
      if: always()
      run: Stop-Process -Name "ngrok" -Force -ErrorAction SilentlyContinue
